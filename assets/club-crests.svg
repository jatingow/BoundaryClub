<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Boundary Club franchise crests</title>
  <defs>
    <g id="club-shield">
      <path fill="currentColor" d="M32 2 57 9v19c0 15-9 26-25 34C16 54 7 43 7 28V9z"/>
      <path stroke="#fff6df" stroke-width="1.5" d="m32 6 21 6v16c0 12-7 22-21 29-14-7-21-17-21-29V12z"/>
      <path fill="#fff6df" d="m26 49 6 2 6-2-6 5z"/>
    </g>
    <symbol id="crest-falcon" viewBox="0 0 64 64">
      <use href="#club-shield"/>
      <path fill="#fff6df" d="m13 22 18-1-7-6 12 3c5 1 8 3 10 7l6 3-6 4-2 7-4-7-8 2-12 10 4-9-7 2 8-8-6 2 5-5z"/>
      <path fill="currentColor" d="m32 23 11 2-3 3zM26 31l9-4-3 4-8 5z"/>
    </symbol>
    <symbol id="crest-knight" viewBox="0 0 64 64">
