      <path fill="#fff6df" d="M20 43c1-6 4-10 8-14l-8 4-5-5 8-8 4-1 2-7 4 5 5-3 4 5-3-1c5 4 8 12 7 25H20z"/>
      <path fill="currentColor" d="m22 25 5-2-2 3h-3zM29 40c1-6 6-9 7-15 3 6 0 10-3 15zM39 40c1-3 2-7 1-11 3 4 4 8 3 11z"/>
      <path stroke="#fff6df" stroke-width="2.4" stroke-linecap="round" d="M21 46h24"/>
    </symbol>
    <symbol id="crest-crown" viewBox="0 0 64 64">
