      <path fill="#fff6df" d="m15 23 10 6 7-14 7 14 10-6-5 16H20z"/>
      <path fill="currentColor" d="m32 26 3 5-3 4-3-4z"/>
      <path stroke="#fff6df" stroke-width="3" stroke-linecap="round" d="M21 43h22"/>
      <g fill="#fff6df"><circle cx="15" cy="21" r="2.2"/><circle cx="32" cy="13.8" r="2.2"/><circle cx="49" cy="21" r="2.2"/></g>
    </symbol>
    <symbol id="crest-thunder" viewBox="0 0 64 64">
      <use href="#club-shield"/>
      <path fill="#fff6df" d="m36 13 9 1-10 13h10L25 48l4-15H19z"/>
      <path stroke="#fff6df" stroke-width="2" stroke-linecap="round" d="m21 17-6 8m7-3-4 5m26 8-5 7"/>
    </symbol>
    <symbol id="crest-tiger" viewBox="0 0 64 64">
      <use href="#club-shield"/>
      <path fill="#fff6df" d="m17 18 7 1 8-4 8 4 7-1 1 9-4 4-1 8-6 3-5 5-5-5-6-3-1-8-4-4z"/>
      <path fill="currentColor" d="m19 21 4 1-4 4zm26 0v5l-4-4zM28 19l4 2 4-2-4 8zm-8 9 9 3-2 3-4-2zm24 0-3 4-4 2-2-3zm-22 6 5 3-4 1zm20 0-1 4-4-1zm-14 2h8l-3 4-1 1-1-1z"/>
      <path stroke="currentColor" stroke-linecap="round" stroke-width="1.7" d="M32 39v3m0 0-3 1m3-1 3 1"/>
