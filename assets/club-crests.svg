  <style>.club-crest-preview{display:none}.club-crest-preview:target{display:inline}</style>
  <use id="logo-falcon" class="club-crest-preview" href="#crest-falcon" color="#16748b"/>
  <use id="logo-knight" class="club-crest-preview" href="#crest-knight" color="#aa444b"/>
  <use id="logo-crown" class="club-crest-preview" href="#crest-crown" color="#267754"/>
  <use id="logo-thunder" class="club-crest-preview" href="#crest-thunder" color="#72509a"/>
  <use id="logo-tiger" class="club-crest-preview" href="#crest-tiger" color="#ae552b"/>
  <use id="logo-star" class="club-crest-preview" href="#crest-star" color="#344e91"/>
